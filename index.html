<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Bazar- simulacion</title>
    <script defer src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>   
    <script defer src="./js/main.js"></script>
    <script defer src="./js/ventas.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>Mundo Bazar</h1>
        <p>Gestión de productos</p>
    </header>
    <main>
        <section id="aviso-bienvenida">
                <p id="mensaje-bienvenida"></p>
            </section>
        <section id="seccion-formulario">
            
            <h2>Agregar producto</h2>
            <input type="text" id="nombre-producto" placeholder="Nombre del producto">
            <input type="number" id="precio-producto" placeholder="Precio">
            <input type="number" id="stock-producto" placeholder="Stock">
            <input type="text" id="imagen-producto" placeholder="Ruta o URL de la imagen">
            <button id="btn-agregar">Agregar producto</button>
            <p id="mensaje"></p>
        </section>
        <section>
            <h2>Buscar productos</h2>
            <input type="text" id="buscador" placeholder="Buscar producto ...">
    </section>
    <section>
        <h2>Productos disponibles</h2>
        <div id="contenedor-productos"></div>
    </section>
    <section id="seccion-venta">
        <h2>Registrar ventas</h2>
        <div id="contenedor-venta"></div>
        <p id="total-venta">Total: $0</p>
        <button id="btn-confirmar-venta">Confirmar venta</button>
        <p id="mensaje-venta"></p>
    </section>
    <section id="seccion-historial">
        <h2>Historial de ventas</h2>
        <button id="boton-vaciar-historial">Vaciar Historial</button>
        <div id="resumen-ventas"></div>
        <div id="contenedor-historial"></div>
    </section>
    </main>

</body>
</html>
